[[package]]
name = "ytdlp-gui"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "deno" },
    { name = "imageio-ffmpeg" },
    { name = "toga-cocoa", marker = "sys_platform == 'darwin'" },
    { name = "toga-gtk", marker = "sys_platform == 'linux'" },
    { name = "toga-winforms", marker = "sys_platform == 'win32'" },
    { name = "yt-dlp", extra = ["default"] },
]

[package.dev-dependencies]
dev = [
    { name = "briefcase" },
]

[package.metadata]
requires-dist = [
    { name = "deno", specifier = ">=2.5" },
    { name = "imageio-ffmpeg", specifier = ">=0.7.0" },
    { name = "toga-cocoa", marker = "sys_platform == 'darwin'", specifier = ">=0.5.7" },
    { name = "toga-gtk", marker = "sys_platform == 'linux'", specifier = ">=0.5.7" },
    { name = "toga-winforms", marker = "sys_platform == 'win32'", specifier = ">=0.5.7" },
    { name = "yt-dlp", extras = ["default"], specifier = ">=2026.10.26" },
]

[package.metadata.requires-dev]
dev = [{ name = "briefcase", specifier = ">=0.4.7" }]
